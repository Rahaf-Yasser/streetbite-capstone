name: flutter_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: 3.5.4

dependencies:
  flutter:
    sdk: flutter

  # UI and state management
  cupertino_icons: ^1.0.8
  google_fonts: 6.2.1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0

  # Networking and local storage
  dio: ^5.11.1
  shared_preferences: ^2.5.3

  # Google Maps
  google_maps_flutter: ^2.10.1

  # Firebase
  firebase_core: 3.13.0
  firebase_auth: 5.5.3
  cloud_firestore: 5.6.7

  # Device authentication and information
  local_auth: 2.3.0
  device_info_plus: 11.3.0

  # Media
  image_picker: 1.1.2

  # Localization and dates
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/StreetBite-Logo.png"